services:
  streamer:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_1}
      - MEDIA_DIR=/media/playlist-1
    volumes:
      - media:/media
    mem_limit: 512m
    cpus: 1.2

  streamer-2:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_2}
      - MEDIA_DIR=/media/playlist-2
    volumes:
      - media:/media
    mem_limit: 512m
    cpus: 1.2

  files:
    image: filebrowser/filebrowser:v2
    # L'image récente refuse d'écrire dans les volumes créés en root.
    user: "0:0"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.rokia-files.rule=Host(`stream.powerfullrokia.link`)
      - traefik.http.routers.rokia-files.entrypoints=https
      - traefik.http.routers.rokia-files.tls=true
      - traefik.http.routers.rokia-files.tls.certresolver=letsencrypt
      - traefik.http.routers.rokia-files.service=rokia-files
      - traefik.http.routers.rokia-files.priority=1000
      - traefik.http.services.rokia-files.loadbalancer.server.port=80
    environment:
      - SERVICE_FQDN_FILES_80
    volumes:
      - media:/srv
      - fb-database:/database
      - fb-config:/config
    mem_limit: 128m

volumes:
  media:
  fb-database:
  fb-config:

networks:
  coolify:
    external: true
    name: coolify