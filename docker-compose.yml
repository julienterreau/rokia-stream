services:
  streamer:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_1}
      - MEDIA_DIR=/media/playlist-1
    volumes:
      - media:/media
    mem_limit: 512m
    cpus: 1.2

  streamer-2:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_2}
      - MEDIA_DIR=/media/playlist-2
    volumes:
      - media:/media
    mem_limit: 512m
    cpus: 1.2

  files:
    image: filebrowser/filebrowser:v2
    # Depuis la 2.33 l'image tourne en 1000:1000 et ne peut plus écrire
    # dans les volumes créés en root : le conteneur quitte, Coolify renvoie 503.
    user: "0:0"
    expose:
      - "80"
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FILES_80
    volumes:
      - media:/srv
      - fb-database:/database
      - fb-config:/config
    mem_limit: 128m

volumes:
  media:
  fb-database:
  fb-config: