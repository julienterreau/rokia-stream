services:
  streamer:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_1}
      - MEDIA_DIR=/media/playlist-1
      - VIDEO_HEIGHT=720
    volumes:
      - media:/media
      - stream-cache:/cache
    mem_limit: 512m
    cpus: 1.2

  streamer-2:
    build: .
    restart: unless-stopped
    environment:
      - YOUTUBE_STREAM_KEY=${YOUTUBE_STREAM_KEY_2}
      - MEDIA_DIR=/media/playlist-2
      - VIDEO_HEIGHT=720
    volumes:
      - media:/media
      - stream-cache:/cache
    mem_limit: 512m
    cpus: 1.2

  files:
    image: filebrowser/filebrowser:v2
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_FILES_80
    volumes:
      - media:/srv
      - fb-database:/database
      - fb-config:/config
    mem_limit: 128m

volumes:
  media:
  stream-cache:
  fb-database:
  fb-config: